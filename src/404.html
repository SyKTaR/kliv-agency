<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cette page n'existe pas ou plus. Retrouvez l'accueil, nos services ou demandez un devis sur le site de Kliv Agency.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#26282C">
  <link rel="icon" type="image/png" sizes="246x246" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700;9..40,800&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <title>Page introuvable | Kliv Agency</title>
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-10) var(--space-6);
      gap: var(--space-6);
    }
    .not-found__code {
      font-family: var(--font-display);
      font-size: clamp(4rem, 12vw, 8rem);
      line-height: 1;
      color: var(--color-text-muted);
    }
    .not-found__title {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
    }
    .not-found__desc {
      max-width: 40ch;
      color: var(--color-text-secondary);
    }
    .not-found__actions {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      justify-content: center;
    }
    .not-found__links {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-4);
      justify-content: center;
      margin-top: var(--space-4);
    }
    .not-found__links a {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      text-decoration: none;
    }
    .not-found__links a:hover { color: var(--color-accent); }
  </style>
</head>
<body>

  <!-- Skip link -->
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>

  <!--#include navbar-->

  <main id="main-content">
    <section class="not-found">
      <span class="not-found__code" aria-hidden="true">404</span>
      <h1 class="not-found__title">Cette page n'existe pas (ou plus).</h1>
      <p class="not-found__desc">
        Le lien est peut-être cassé ou la page a été déplacée. Voici où continuer :
      </p>
      <div class="not-found__actions">
        <a href="/" class="btn btn--primary btn--lg">Retour à l'accueil</a>
        <a href="/devis" class="btn btn--outline btn--lg">Parler de votre projet</a>
      </div>
      <nav class="not-found__links" aria-label="Nos services">
        <a href="/services/site-web">Site web</a>
        <a href="/services/identite-marque">Identité de marque</a>
        <a href="/services/outil-metier">Outil métier</a>
        <a href="/services/crm-dashboard">CRM &amp; Dashboard</a>
        <a href="/services/accompagnement">Accompagnement</a>
      </nav>
    </section>
  </main>

  <!--#include footer-->

  <script type="module" src="js/main.js"></script>
</body>
</html>
